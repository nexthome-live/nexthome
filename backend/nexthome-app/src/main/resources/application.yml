spring:
  application:
    name: nexthome-app
  datasource:
    url: ${DB_URL:jdbc:mysql://nexthome-nexthome.l.aivencloud.com:14556/vacancy_db}
    username: ${DB_USERNAME:avnadmin}
    password: ${DB_PASSWORD:AVNS_gnhYrsECOIB0hcmdylj}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

server:
  port: ${PORT:8080}

# CORS
# - Local dev: allow Vite origins (5173) and Vite preview (4173).
# - Production (Cloud Run): override CORS_ALLOWED_ORIGINS with the deployed frontend URL
#   (e.g. https://nexthome-live.github.io). See deployment docs.
cors:
  # Comma-separated list of allowed origins.
  # - Local dev: Vite origins (5173) and Vite preview (4173).
  # - Production on GitHub Pages: https://nexthome-live.github.io
  # - Production backend on Render: this service's own URL is allowed too
  #   so server-to-server / curl probes from the same origin succeed.
  # Override at runtime via the CORS_ALLOWED_ORIGINS env var (Render dashboard
  # or `docker run -e CORS_ALLOWED_ORIGINS=...`).
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173,https://nexthome-live.github.io,https://nexthome-kkr6.onrender.com}
  allowed-methods: ${CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,OPTIONS}
  allowed-headers: ${CORS_ALLOWED_HEADERS:Content-Type,Accept,Authorization,X-Management-Token}
  max-age: 3600

management:
  endpoints:
    web:
      exposure:
        include: health,info
