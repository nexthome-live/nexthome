# Deploys the Vite/React frontend to GitHub Pages.
#
# How it works:
#   1. Checkout the repo.
#   2. Set up Node 20.
#   3. Install npm dependencies.
#   4. Build the Vite app, injecting VITE_API_BASE_URL from a repo secret so
#      the deployed site talks to the live backend instead of localhost.
#   5. Upload the static build artifact to GitHub Pages.
#   6. Deploy to Pages (visible at https://<org>.github.io/nextHome).
#
# Required GitHub Pages setup (one-time, in repo Settings → Pages):
#   - Source: "GitHub Actions"
#
# Required GitHub repository secret:
#   - VITE_API_BASE_URL
#       Example: https://nexthome-app-xxxxx-uc.a.run.app
#       (No trailing slash. Must be the public URL of the deployed backend.)

name: Deploy frontend to GitHub Pages

# Hard guard: a Pages build that uses Actions only works when the repo's
# Pages source is "GitHub Actions". If it's still set to "Deploy from a
# branch", GitHub will serve the repo root (often falling back to
# README.md) and our build will look broken even though it succeeded.
# We can't read repo settings from inside the workflow, so we surface
# this as a clearly visible job summary message instead.

on:
  # Deploy on every push to main so the live site always reflects HEAD.
  # (If you only want to rebuild on frontend changes, see the optional
  # `paths` filter commented below — but note that path filters can
  # silently prevent a rebuild when only the workflow file changed.)
  push:
    branches: ["main"]
  # Optional path filter (uncomment to re-enable):
  #   paths:
  #     - "frontend/**"
  #     - ".github/workflows/deploy-frontend-pages.yml"
  # Allow manual runs from the Actions tab.
  workflow_dispatch:

# Same minimal permissions the Jekyll sample uses.
permissions:
  contents: read
  pages: write
  id-token: write

# Don't cancel an in-flight Pages deploy — let it finish.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Build the Vite app. We pass VITE_API_BASE_URL so the deployed site
      # talks to the live backend. Falls back to the local default if the
      # secret isn't set yet.
      - name: Build with Vite
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
        run: npm run build

      # GitHub Pages runs Jekyll by default. Even though we don't use
      # Jekyll, Jekyll will skip any file or folder that starts with
      # an underscore (e.g. `/_assets/...`) and may transform our
      # output. Drop a `.nojekyll` file in the build output to opt out.
      - name: Disable Jekyll processing
        run: touch dist/.nojekyll

      # SPA fallback: when a user hits a deep link like
      # /nexthome/manage/123, GitHub Pages would otherwise 404. Serving
      # index.html as 404.html makes the SPA load and client-side
      # routing can take over.
      - name: Add SPA 404 fallback
        run: cp dist/index.html dist/404.html

      # Surface the absolute path of the build output so we can verify it
      # exists, and so the upload step can reference it by an absolute
      # path (the upload-pages-artifact action ignores the job's
      # `working-directory` and resolves `./dist` against the runner root,
      # which fails when the build ran in a subdirectory).
      - name: Verify build output
        run: |
          {
            echo "DIST_ABS_PATH=$(pwd)/dist"
            echo "### Frontend build output"
            echo ""
            echo "Files at the root of the Pages artifact:"
            echo '```'
            ls -la dist | head -50
            echo '```'
            echo ""
            echo "First 40 lines of dist/index.html (this is what GitHub Pages serves):"
            echo '```html'
            head -40 dist/index.html
            echo '```'
            echo ""
            echo "If GitHub Pages still renders README.md:"
            echo "1. Settings → Pages → Source must be **GitHub Actions** (not a branch)."
            echo "2. The site URL is https://nexthome-live.github.io/nexthome/ — not the repo root."
            echo "3. Hard refresh (Ctrl/Cmd+Shift+R) — old branch-deploys are cached briefly."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # IMPORTANT: pass an absolute path. The upload action does not
          # honor the job's `defaults.run.working-directory`; it resolves
          # relative paths against the runner's HOME, which is why
          # earlier runs failed with "tar: dist: Cannot open".
          path: ${{ github.workspace }}/frontend/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
